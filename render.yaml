services:
  - type: web
    name: reset-wellness-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AIML_API_KEY
        sync: false
      - key: AIML_API_BASE_URL
        value: https://api.aimlapi.com/v1
      - key: AIML_MODEL
        value: gpt-4o-mini
      - key: FRONTEND_URL
        value: https://reset-wellness.vercel.app,http://localhost:5173
      - key: ALLOW_ALL_ORIGINS
        value: "true"
    plan: free
    healthCheckPath: /health
